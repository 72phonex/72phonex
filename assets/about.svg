<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="920" height="250" fill="none">
  <defs>
    <linearGradient id="about-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="gold-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="cyan-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38BDF8" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Space Grotesk", sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "Fira Code", Consolas, monospace; }
  </style>

  <!-- Left Card: Stoic Creed -->
  <g transform="translate(0, 0)">
    <rect width="445" height="250" rx="14" fill="#0A0F1D"/>
    <rect width="445" height="250" rx="14" fill="url(#dot-grid)"/>
    <rect x="1" y="1" width="443" height="248" rx="13" fill="none" stroke="url(#card-border)" stroke-width="1.2"/>

    <!-- Spartan Emblem Watermark -->
    <path d="M 370 70 L 390 110 L 370 150 L 350 110 Z" fill="#F59E0B" fill-opacity="0.04"/>
    <circle cx="370" cy="110" r="45" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.06"/>

    <!-- Header Badge -->
    <g transform="translate(24, 24)">
      <rect width="138" height="20" rx="4" fill="#161F30"/>
      <text x="8" y="14" class="font-mono" font-size="9.5" font-weight="600" fill="#F59E0B" letter-spacing="1">THE CRAFT // CREED</text>
    </g>

    <text x="24" y="74" class="font-sans" font-size="18" font-weight="700" fill="url(#gold-text)">
      STOIC ENGINEERING
    </text>

    <!-- Quote -->
    <text x="24" y="106" class="font-sans" font-size="13" fill="#E2E8F0" font-weight="400" line-height="22">
      <tspan x="24" dy="0">"Dedicated to the quiet craft of software engineering,</tspan>
      <tspan x="24" dy="20">transforming complex problems into elegant, enduring</tspan>
      <tspan x="24" dy="20">code. Driven by purpose and the pursuit of</tspan>
      <tspan x="24" dy="20" fill="#FDE68A" font-weight="600">digital resilience."</tspan>
    </text>

    <!-- Footer Meta -->
    <line x1="24" y1="195" x2="421" y2="195" stroke="#1E293B" stroke-width="1"/>
    <text x="24" y="222" class="font-mono" font-size="10" fill="#64748B">
      <tspan fill="#F59E0B">✦</tspan> Order from Chaos <tspan fill="#334155">|</tspan> Precision over Noise
    </text>
  </g>

  <!-- Right Card: Research Thesis Vectors -->
  <g transform="translate(475, 0)">
    <rect width="445" height="250" rx="14" fill="#0A0F1D"/>
    <rect width="445" height="250" rx="14" fill="url(#dot-grid)"/>
    <rect x="1" y="1" width="443" height="248" rx="13" fill="none" stroke="url(#card-border)" stroke-width="1.2"/>

    <!-- Header Badge -->
    <g transform="translate(24, 24)">
      <rect width="170" height="20" rx="4" fill="#161F30"/>
      <text x="8" y="14" class="font-mono" font-size="9.5" font-weight="600" fill="#38BDF8" letter-spacing="1">RESEARCH DIRECTIONS</text>
    </g>

    <text x="24" y="74" class="font-sans" font-size="18" font-weight="700" fill="url(#cyan-text)">
      COGNITIVE VECTORS
    </text>

    <!-- 4 Vectors -->
    <g transform="translate(24, 90)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <text x="0" y="14" class="font-mono" font-size="11" font-weight="700" fill="#38BDF8">01</text>
        <text x="24" y="14" class="font-sans" font-size="12.5" font-weight="600" fill="#F8FAFC">Synthetic Affect &amp; Emotion in LLMs</text>
        <text x="24" y="28" class="font-mono" font-size="10" fill="#64748B">Dynamic affect weights modulating reasoning paths</text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(0, 36)">
        <text x="0" y="14" class="font-mono" font-size="11" font-weight="700" fill="#F59E0B">02</text>
        <text x="24" y="14" class="font-sans" font-size="12.5" font-weight="600" fill="#F8FAFC">Multi-Tier Continuous Memory</text>
        <text x="24" y="28" class="font-mono" font-size="10" fill="#64748B">Episodic + Semantic RAG in persistent stores</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 72)">
        <text x="0" y="14" class="font-mono" font-size="11" font-weight="700" fill="#818CF8">03</text>
        <text x="24" y="14" class="font-sans" font-size="12.5" font-weight="600" fill="#F8FAFC">Self-Mutating Autonomous Loops</text>
        <text x="24" y="28" class="font-mono" font-size="10" fill="#64748B">Systems that diagnose &amp; rewrite runtime logic</text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(0, 108)">
        <text x="0" y="14" class="font-mono" font-size="11" font-weight="700" fill="#10B981">04</text>
        <text x="24" y="14" class="font-sans" font-size="12.5" font-weight="600" fill="#F8FAFC">Air-Gapped Sovereign Inference</text>
        <text x="24" y="28" class="font-mono" font-size="10" fill="#64748B">High-throughput private execution on edge hardware</text>
      </g>
    </g>
  </g>
</svg>
