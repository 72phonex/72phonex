<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 296 215" width="296" height="215" fill="none">
  <defs>
    <linearGradient id="bg-c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14110A"/>
      <stop offset="100%" stop-color="#080705"/>
    </linearGradient>
    <linearGradient id="border-c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="title-c" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Space Grotesk", sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "Fira Code", Consolas, monospace; }
  </style>

  <rect width="296" height="215" rx="12" fill="url(#bg-c)"/>
  <rect x="1" y="1" width="294" height="213" rx="11" fill="none" stroke="url(#border-c)" stroke-width="1.2"/>
  <rect x="0" y="0" width="296" height="3" rx="1" fill="#F59E0B"/>

  <!-- Top Pill -->
  <g transform="translate(18, 16)">
    <rect width="144" height="18" rx="4" fill="#2E1C0A"/>
    <text x="6" y="13" class="font-mono" font-size="8.5" font-weight="700" fill="#FBBF24" letter-spacing="1">SELF-EVOLVING SYSTEM</text>
  </g>

  <!-- Title -->
  <text x="18" y="58" class="font-sans" font-size="22" font-weight="800" fill="url(#title-c)" letter-spacing="1">
    CALSIER AI
  </text>
  <text x="18" y="74" class="font-mono" font-size="10.5" fill="#94A3B8">
    Mutating Logic &amp; Module Engine
  </text>

  <!-- Description -->
  <text x="18" y="98" class="font-sans" font-size="11.5" fill="#CBD5E1">
    <tspan x="18" dy="0">Transcend static LLM prompts. A system</tspan>
    <tspan x="18" dy="16">engineered to continuously evolve its own</tspan>
    <tspan x="18" dy="16">sub-modules from observed usage patterns.</tspan>
  </text>

  <!-- Tech Chips -->
  <g transform="translate(18, 150)">
    <rect x="0" y="0" width="56" height="20" rx="4" fill="#2E1C0A" stroke="#52320E" stroke-width="0.75"/>
    <text x="8" y="14" class="font-mono" font-size="9.5" fill="#FBBF24">Python</text>

    <rect x="62" y="0" width="64" height="20" rx="4" fill="#2E1C0A" stroke="#52320E" stroke-width="0.75"/>
    <text x="70" y="14" class="font-mono" font-size="9.5" fill="#FBBF24">Groq API</text>

    <rect x="132" y="0" width="86" height="20" rx="4" fill="#2E1C0A" stroke="#52320E" stroke-width="0.75"/>
    <text x="140" y="14" class="font-mono" font-size="9.5" fill="#FBBF24">Self-Evolution</text>
  </g>

  <!-- Bottom CTA -->
  <line x1="18" y1="182" x2="278" y2="182" stroke="#1E293B" stroke-width="1"/>
  <text x="18" y="200" class="font-mono" font-size="10" fill="#64748B">REPOSITORY: </text>
  <text x="88" y="200" class="font-mono" font-size="10" font-weight="700" fill="#FBBF24">72phonex/CALSIER-AI →</text>
</svg>