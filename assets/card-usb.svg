  <rect width="296" height="215" rx="12" fill="url(#bg-u)"/>
  <rect x="1" y="1" width="294" height="213" rx="11" fill="none" stroke="url(#border-u)" stroke-width="1.2"/>
  <rect x="0" y="0" width="296" height="3" rx="1" fill="#10B981"/>

