<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 140" width="920" height="140" fill="none">
  <defs>
    <linearGradient id="foot-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="foot-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="quote-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Space Grotesk", sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "Fira Code", Consolas, monospace; }
  </style>

  <rect width="920" height="140" rx="14" fill="url(#foot-bg)"/>
  <rect x="1" y="1" width="918" height="138" rx="13" fill="none" stroke="url(#foot-border)" stroke-width="1.2"/>

  <!-- Center Spartan Seal Glyph -->
  <g transform="translate(460, 36)">
    <circle cx="0" cy="0" r="18" fill="#0C1322" stroke="#F59E0B" stroke-width="1.2"/>
    <path d="M 0 -9 L 7 -2 L 0 7 L -7 -2 Z" fill="#FDE68A"/>
    <circle cx="-32" cy="0" r="1.5" fill="#38BDF8"/>
    <circle cx="32" cy="0" r="1.5" fill="#38BDF8"/>
  </g>

  <!-- Quote -->
  <text x="460" y="84" class="font-sans" font-size="18" font-weight="700" fill="url(#quote-grad)" text-anchor="middle" letter-spacing="1">
    "Building toward Jarvis. One commit at a time."
  </text>

  <!-- Telemetry Signoff -->
  <text x="460" y="112" class="font-mono" font-size="11" fill="#64748B" text-anchor="middle" letter-spacing="1.5">
    ARYAN MALIK <tspan fill="#F59E0B">•</tspan> @72PHONEX <tspan fill="#38BDF8">•</tspan> DELHI, INDIA <tspan fill="#818CF8">•</tspan> COGNITIVE COMPUTING
  </text>
</svg>