<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 36" width="920" height="36" fill="none">
  <defs>
    <linearGradient id="div-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#818CF8" stop-opacity="0.6"/>
