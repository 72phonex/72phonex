<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="920" height="220" fill="none">
  <defs>
    <linearGradient id="stack-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="stack-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Space Grotesk", sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "Fira Code", Consolas, monospace; }
  </style>

  <rect width="920" height="220" rx="14" fill="url(#stack-bg)"/>
  <rect x="1" y="1" width="918" height="218" rx="13" fill="none" stroke="url(#stack-border)" stroke-width="1.2"/>

  <!-- Top Title Bar -->
  <g transform="translate(28, 22)">
    <rect width="168" height="20" rx="4" fill="#161F30"/>
    <text x="8" y="14" class="font-mono" font-size="9.5" font-weight="700" fill="#F59E0B" letter-spacing="1">COGNITIVE ARSENAL</text>
    <text x="184" y="14" class="font-mono" font-size="10" fill="#64748B">// SYSTEM ARCHITECTURE &amp; TOOLS</text>
  </g>

  <!-- 4 Bento Columns -->
  <g transform="translate(28, 56)">
    <!-- Column 1: AI & ML -->
    <g transform="translate(0, 0)">
      <rect width="202" height="138" rx="8" fill="#0C1322" stroke="#1E293B" stroke-width="1"/>
      <line x1="0" y1="0" x2="202" y2="0" stroke="#38BDF8" stroke-width="2"/>
      <text x="14" y="24" class="font-mono" font-size="10.5" font-weight="700" fill="#38BDF8">01 // AI &amp; REASONING</text>
      
      <text x="14" y="52" class="font-sans" font-size="12" fill="#F8FAFC">PyTorch • Hugging Face</text>
      <text x="14" y="74" class="font-sans" font-size="12" fill="#CBD5E1">Mistral 7B • LoRA Adapter</text>
      <text x="14" y="96" class="font-sans" font-size="12" fill="#CBD5E1">Groq LPU • FastEmbed</text>
      <text x="14" y="118" class="font-mono" font-size="10.5" fill="#38BDF8">Autonomous Loops</text>
    </g>

    <!-- Column 2: Systems & Backend -->
    <g transform="translate(220, 0)">
      <rect width="202" height="138" rx="8" fill="#0C1322" stroke="#1E293B" stroke-width="1"/>
      <line x1="0" y1="0" x2="202" y2="0" stroke="#F59E0B" stroke-width="2"/>
      <text x="14" y="24" class="font-mono" font-size="10.5" font-weight="700" fill="#F59E0B">02 // SYSTEMS &amp; DATA</text>
      
      <text x="14" y="52" class="font-sans" font-size="12" fill="#F8FAFC">Python (Core Engine)</text>
      <text x="14" y="74" class="font-sans" font-size="12" fill="#CBD5E1">FastAPI • Flask</text>
      <text x="14" y="96" class="font-sans" font-size="12" fill="#CBD5E1">Supabase • PostgreSQL</text>
      <text x="14" y="118" class="font-mono" font-size="10.5" fill="#F59E0B">Vector Embeddings</text>
    </g>

    <!-- Column 3: Frontend & Interaction -->
    <g transform="translate(440, 0)">
      <rect width="202" height="138" rx="8" fill="#0C1322" stroke="#1E293B" stroke-width="1"/>
      <line x1="0" y1="0" x2="202" y2="0" stroke="#818CF8" stroke-width="2"/>
      <text x="14" y="24" class="font-mono" font-size="10.5" font-weight="700" fill="#818CF8">03 // INTERACTION &amp; UI</text>
      
      <text x="14" y="52" class="font-sans" font-size="12" fill="#F8FAFC">TypeScript • JavaScript</text>
      <text x="14" y="74" class="font-sans" font-size="12" fill="#CBD5E1">Next.js • React</text>
      <text x="14" y="96" class="font-sans" font-size="12" fill="#CBD5E1">Tailwind CSS • SVG Core</text>
      <text x="14" y="118" class="font-mono" font-size="10.5" fill="#818CF8">Frontend AI Agent Skill</text>
    </g>

    <!-- Column 4: Infrastructure & OS -->
    <g transform="translate(660, 0)">
      <rect width="202" height="138" rx="8" fill="#0C1322" stroke="#1E293B" stroke-width="1"/>
      <line x1="0" y1="0" x2="202" y2="0" stroke="#10B981" stroke-width="2"/>
      <text x="14" y="24" class="font-mono" font-size="10.5" font-weight="700" fill="#10B981">04 // INFRA &amp; RUNTIME</text>
      
      <text x="14" y="52" class="font-sans" font-size="12" fill="#F8FAFC">Linux (Debian / Arch)</text>
      <text x="14" y="74" class="font-sans" font-size="12" fill="#CBD5E1">Git • GitHub Actions</text>
      <text x="14" y="96" class="font-sans" font-size="12" fill="#CBD5E1">Docker • Tailscale</text>
      <text x="14" y="118" class="font-mono" font-size="10.5" fill="#10B981">Air-Gapped Hardware</text>
    </g>
  </g>
</svg>